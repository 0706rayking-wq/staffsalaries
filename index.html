<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廚房薪資考核管理系統 - 雲端同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .chart-container { position: relative; width: 100%; height: 260px; margin: 0 auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        select { cursor: pointer; }
        @media (max-width: 768px) {
            .desktop-only { display: none; }
        }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20 md:pb-0">

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-500 mb-4"></div>
        <p class="text-slate-500 text-sm">正在同步雲端資料庫...</p>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-emerald-500 rounded flex items-center justify-center font-bold text-lg">薪</div>
                <h1 class="text-lg font-bold tracking-tight">廚房薪資管理 <span class="text-[10px] font-normal text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded ml-1">雲端同步版</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="addNewStaff()" class="p-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm transition font-bold">＋ 新增員工</button>
                <button onclick="exportCSV()" class="p-2 bg-slate-700 rounded text-sm desktop-only">匯出 CSV</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- KPI Cards -->
        <section class="flex overflow-x-auto gap-4 pb-2 no-scrollbar snap-x">
            <div class="min-w-[240px] flex-shrink-0 bg-white p-5 rounded-xl shadow-sm border border-slate-200 snap-center">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">下月預計總支出</p>
                <h3 class="text-2xl font-bold mt-1 text-slate-800" id="kpi-total-pay">$0</h3>
            </div>
            <div class="min-w-[240px] flex-shrink-0 bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-emerald-500 snap-center">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">下月預計平均</p>
                <h3 class="text-2xl font-bold mt-1 text-slate-800" id="kpi-avg-pay">$0</h3>
                <p class="text-[10px] text-slate-400" id="kpi-avg-count">基於 0 人</p>
            </div>
            <div class="min-w-[240px] flex-shrink-0 bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-sky-500 snap-center">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">考核加給達標</p>
                <h3 class="text-2xl font-bold mt-1 text-slate-800" id="kpi-maxed">0</h3>
            </div>
            <div class="min-w-[240px] flex-shrink-0 bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-amber-500 snap-center">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">下月預計調薪</p>
                <h3 class="text-2xl font-bold mt-1 text-slate-800" id="kpi-adjustments">0</h3>
            </div>
        </section>

        <!-- Charts -->
        <section class="hidden md:grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="chart-container"><canvas id="salaryChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center">
                <h4 class="font-bold text-slate-700 mb-4 text-sm">雲端同步說明</h4>
                <div class="p-3 bg-emerald-50 rounded-lg text-[11px] text-emerald-800 leading-relaxed space-y-2">
                    <p><strong>即時存檔：</strong> 所有的修改都會自動同步到 Firebase 雲端資料庫。</p>
                    <p><strong>跨裝置：</strong> 在手機、平板或不同電腦開啟網址，資料都會是一樣的。</p>
                    <p><strong>安全性：</strong> 管理職位之預計薪資僅顯示於管理端。</p>
                </div>
            </div>
        </section>

        <!-- Staff List (Mobile View: Cards, Desktop View: Table) -->
        <section class="bg-white md:rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 class="text-base font-bold">員工清單與考核狀態</h2>
                <div class="flex items-center gap-2">
                    <span id="sync-status" class="text-[10px] font-bold text-emerald-500">● 雲端連線中</span>
                    <span class="text-[10px] text-slate-400">基準：114年1月</span>
                </div>
            </div>
            
            <div id="staff-cards" class="md:hidden divide-y divide-slate-100"></div>

            <div class="hidden md:block overflow-x-auto no-scrollbar">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                            <th class="px-4 py-4 sticky left-0 bg-slate-50 z-10 w-32 shadow-[2px_0_5px_rgba(0,0,0,0.05)]">姓名</th>
                            <th class="px-4 py-4 w-40">職位 / 狀態</th>
                            <th class="px-4 py-4 text-center">各區站考核 (年/月)</th>
                            <th class="px-4 py-4 text-right w-32">加給彙整</th>
                            <th class="px-4 py-4 text-right w-24">本月實領</th>
                            <th class="px-4 py-4 text-right w-24 bg-emerald-50/30">下月預計</th>
                            <th class="px-4 py-4 w-20 text-center">異動</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal for Station Editing (Mobile) -->
    <div id="station-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg" id="modal-name">區站考核編輯</h3>
                <button onclick="closeModal()" class="text-slate-400 p-1">✕</button>
            </div>
            <div id="modal-content" class="grid grid-cols-1 gap-3 max-h-[60vh] overflow-y-auto pr-2 no-scrollbar"></div>
            <button onclick="closeModal()" class="w-full mt-6 py-3 bg-slate-900 text-white rounded-xl font-bold">完成並儲存</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- ⚠️ 步驟：請在此處貼上你在 Firebase 取得的 Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCbW_5pInvvC8aJbMn93roWVKyvk1UnVVc", // 貼上你的 apiKey
            authDomain: "kitchensalary-ac449.firebaseapp.com", // 貼上你的 authDomain
            projectId: "kitchensalary-ac449", // 貼上你的 projectId
            storageBucket: "kitchensalary-ac449.firebasestorage.app",
            messagingSenderId: "222432923765",
            appId: "1:222432923765:web:9a4ef1761b7a9c9a60683c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "kitchen-salary-nankang";

        // --- Constants ---
        const CURRENT_YEAR = 2026;
        const CURRENT_MONTH = 1;
        const BASE_SALARY = 36000;
        const POSITIONS = ["正職", "副領班", "領班", "副主廚", "主廚", "行政副主廚", "計時人員"];
        const LEADERSHIP_ROLES = ["副領班", "領班", "副主廚", "主廚", "行政副主廚"];
        const YEARS = [2024, 2025, 2026];
        const MONTHS = Array.from({length: 12}, (_, i) => i + 1);
        const STATIONS = [
            { id: 'soup', name: '湯區', val: 900 }, { id: 'cook1', name: '熟食一', val: 700 },
            { id: 'cook2', name: '熟食二', val: 800 }, { id: 'cold', name: '冷台', val: 600 },
            { id: 'sea', name: '海鮮吧', val: 600 }, { id: 'light', name: '輕食區', val: 500 },
            { id: 'drink', name: '飲調', val: 400 }, { id: 'veg', name: '蔬菜吧', val: 400 },
            { id: 'dessert', name: '甜點', val: 300 }, { id: 'meat', name: '切肉', val: 200 }
        ];

        let staffData = [];
        let mainChart = null;

        // --- Auth & Sync ---
        const initFirebase = async () => {
            try {
                // 自動使用匿名登入確保連線權限
                await signInAnonymously(auth);
                
                // 監聽雲端資料異動
                const staffCol = collection(db, 'artifacts', appId, 'public', 'data', 'staff');
                onSnapshot(staffCol, (snapshot) => {
                    staffData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // 如果雲端沒資料，初始化預設名單
                    if (staffData.length === 0) seedInitialData();
                    
                    updateUI();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('sync-status').innerText = "● 雲端同步中";
                });
            } catch (e) {
                console.error("Firebase 連線失敗", e);
                alert("資料庫連線失敗，請檢查 Config 是否正確且安全性規則已設為測試模式。");
            }
        };

        const seedInitialData = async () => {
            const names = ["黃遠志", "王永銓", "鄭棋云", "洪翊勛", "鄭仲翔", "范秋璇", "林彥廷", "邱逢甲", "劉軒菱", "蔡詠恩", "黃韻頻", "秦崇豪", "王芳芳", "張家寧", "張鳳臻", "黃祥有", "黃邦菊", "段宇", "王思恩", "林意瑄"];
            for (const name of names) {
                const id = "ID_" + Math.random().toString(36).substr(2, 9);
                const member = {
                    name: name,
                    pos: "正職",
                    fullDay: false, mgr: false, ga: false,
                    stations: STATIONS.reduce((acc, s) => ({ ...acc, [s.id]: { y: null, m: null } }), {})
                };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'staff', id), member);
            }
        };

        // --- Interaction Handlers (Cloud) ---
        window.updateMemberField = async (id, field, value) => {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'staff', id);
            await updateDoc(docRef, { [field]: value });
        };

        window.updateStationField = async (memberId, stationId, type, value) => {
            const member = staffData.find(m => m.id === memberId);
            const updatedStations = { ...member.stations };
            updatedStations[stationId][type] = value === "" ? null : parseInt(value);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'staff', memberId);
            await updateDoc(docRef, { stations: updatedStations });
        };

        window.addNewStaff = async () => {
            const name = prompt("請輸入新員工姓名：");
            if (name && name.trim()) {
                const id = "ID_" + Math.random().toString(36).substr(2, 9);
                const member = {
                    name: name,
                    pos: "正職",
                    fullDay: false, mgr: false, ga: false,
                    stations: STATIONS.reduce((acc, s) => ({ ...acc, [s.id]: { y: null, m: null } }), {})
                };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'staff', id), member);
            }
        };

        window.deleteMember = async (id) => {
            if (confirm("確定要刪除此同仁嗎？資料將從雲端移除。")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'staff', id));
            }
        };

        // --- Calculations ---
        function calculateSalary(member) {
            const isPublic = !LEADERSHIP_ROLES.includes(member.pos);
            let fixedBonus = 0;
            if (member.fullDay) fixedBonus += 4000;
            if (member.mgr) fixedBonus += 500;
            if (member.ga) fixedBonus += 1000;

            let currentSkillSum = 0, nextSkillSum = 0, targetSkillSum = 0;
            const currentTotalMonths = CURRENT_YEAR * 12 + CURRENT_MONTH;
            const nextTotalMonths = currentTotalMonths + 1;

            STATIONS.forEach(s => {
                const record = member.stations[s.id];
                if (record && record.y && record.m) {
                    const passTotalMonths = parseInt(record.y) * 12 + parseInt(record.m);
                    const effectiveMonths = passTotalMonths + 2;
                    targetSkillSum += s.val;
                    if (effectiveMonths <= currentTotalMonths) currentSkillSum += s.val;
                    if (effectiveMonths <= nextTotalMonths) nextSkillSum += s.val;
                }
            });

            const currentSkillBonus = Math.min(currentSkillSum, 4000);
            const nextSkillBonus = Math.min(nextSkillSum, 4000);
            const totalSkillAccumulated = Math.min(targetSkillSum, 4000);

            return { 
                currentTotal: BASE_SALARY + fixedBonus + currentSkillBonus, 
                nextTotal: BASE_SALARY + fixedBonus + nextSkillBonus, 
                fixedBonus, currentSkillBonus, nextSkillBonus, totalSkillAccumulated,
                isPublic, isIncreased: nextSkillBonus > currentSkillBonus
            };
        }

        // --- UI Rendering ---
        function updateUI() {
            renderKPIs();
            renderTable();
            renderCards();
            renderCharts();
        }

        function renderKPIs() {
            let nextTotal = 0, maxed = 0, publicCount = 0, adjustments = 0;
            staffData.forEach(m => {
                const res = calculateSalary(m);
                if (res.isPublic) { nextTotal += res.nextTotal; publicCount++; }
                if (res.totalSkillAccumulated >= 4000) maxed++;
                if (res.isIncreased) adjustments++;
            });
            document.getElementById('kpi-total-pay').innerText = `$${nextTotal.toLocaleString()}`;
            document.getElementById('kpi-avg-pay').innerText = publicCount > 0 ? `$${Math.round(nextTotal / publicCount).toLocaleString()}` : "$0";
            document.getElementById('kpi-avg-count').innerText = `基於 ${publicCount} 名正職預估`;
            document.getElementById('kpi-maxed').innerText = maxed;
            document.getElementById('kpi-adjustments').innerText = adjustments;
        }

        function renderTable() {
            const tbody = document.getElementById('staff-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            staffData.forEach((member) => {
                const res = calculateSalary(member);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-4 sticky left-0 bg-white z-10 border-r border-slate-100 font-bold text-slate-700 shadow-[2px_0_5px_rgba(0,0,0,0.02)]">
                        <div class="flex flex-col">
                            <input type="text" value="${member.name}" onchange="window.updateMemberField('${member.id}', 'name', this.value)" class="bg-transparent w-full font-bold focus:outline-none focus:text-emerald-600">
                            <button onclick="window.deleteMember('${member.id}')" class="text-[9px] text-red-300 hover:text-red-500 text-left mt-1 uppercase font-bold tracking-tighter">刪除</button>
                        </div>
                    </td>
                    <td class="px-4 py-4">
                        <select onchange="window.updateMemberField('${member.id}', 'pos', this.value)" class="text-[11px] font-bold text-slate-600 bg-slate-100 rounded px-1 py-1 mb-2 block w-full outline-none">
                            ${POSITIONS.map(p => `<option value="${p}" ${member.pos === p ? 'selected' : ''}>${p}</option>`).join('')}
                        </select>
                        <div class="flex flex-wrap gap-2">
                            ${['fullDay', 'mgr', 'ga'].map(key => `
                                <label class="inline-flex items-center text-[10px] cursor-pointer text-slate-500">
                                    <input type="checkbox" ${member[key] ? 'checked' : ''} onchange="window.updateMemberField('${member.id}', '${key}', this.checked)" class="rounded text-emerald-500 mr-1">
                                    ${key === 'fullDay' ? '全日' : key === 'mgr' ? '區長' : '工務'}
                                </label>
                            `).join('')}
                        </div>
                    </td>
                    <td class="px-4 py-4">
                        <div class="grid grid-cols-5 gap-1 min-w-[360px]">
                            ${STATIONS.map(s => {
                                const record = member.stations[s.id];
                                return `
                                <div class="flex flex-col p-1 bg-slate-50/50 rounded border border-slate-100">
                                    <span class="text-[7px] text-slate-400 font-bold uppercase truncate">${s.name}</span>
                                    <div class="flex gap-0.5">
                                        <select onchange="window.updateStationField('${member.id}', '${s.id}', 'y', this.value)" class="text-[9px] bg-white border border-slate-200 rounded px-0.5 w-1/2">
                                            <option value="">年</option>${YEARS.map(y => `<option value="${y}" ${record.y == y ? 'selected' : ''}>${y}</option>`).join('')}
                                        </select>
                                        <select onchange="window.updateStationField('${member.id}', '${s.id}', 'm', this.value)" class="text-[9px] bg-white border border-slate-200 rounded px-0.5 w-1/2">
                                            <option value="">月</option>${MONTHS.map(m => `<option value="${m}" ${record.m == m ? 'selected' : ''}>${m}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </td>
                    <td class="px-4 py-4 text-right">
                        <div class="flex flex-col items-end">
                            <div class="flex flex-wrap justify-end gap-0.5 mb-1">
                                ${member.fullDay ? '<span class="px-1 bg-sky-100 text-sky-700 text-[8px] rounded font-bold">全日</span>' : ''}
                                ${member.ga ? '<span class="px-1 bg-indigo-100 text-indigo-700 text-[8px] rounded font-bold">工務</span>' : ''}
                                ${member.mgr ? '<span class="px-1 bg-amber-100 text-amber-700 text-[8px] rounded font-bold">區長</span>' : ''}
                            </div>
                            <span class="font-bold text-emerald-600">+$${(res.totalSkillAccumulated + res.fixedBonus).toLocaleString()}</span>
                        </div>
                    </td>
                    <td class="px-4 py-4 text-right">
                        ${res.isPublic ? `<span class="font-bold text-slate-700">$${res.currentTotal.toLocaleString()}</span>` : `<span class="text-slate-300 italic text-xs">不公開</span>`}
                    </td>
                    <td class="px-4 py-4 text-right bg-emerald-50/30">
                        ${res.isPublic ? `<span class="font-bold text-slate-900 text-base">$${res.nextTotal.toLocaleString()}</span>` : `<span class="text-slate-300 italic text-xs">不公開</span>`}
                    </td>
                    <td class="px-4 py-4 text-center">
                        ${res.isIncreased ? `<span class="text-[10px] px-2 py-1 rounded bg-amber-100 text-amber-700 font-bold whitespace-nowrap">下月調薪</span>` : `<span class="text-slate-300 text-[10px]">-</span>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCards() {
            const container = document.getElementById('staff-cards');
            if (!container) return;
            container.innerHTML = '';
            staffData.forEach((member) => {
                const res = calculateSalary(member);
                const card = document.createElement('div');
                card.className = "p-4 flex flex-col gap-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${member.name}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded font-medium">${member.pos}</span>
                                ${res.isIncreased ? `<span class="text-[10px] px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded font-bold uppercase">下月調薪</span>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400 font-bold uppercase">下月預計</p>
                            <p class="text-xl font-bold text-emerald-600">${res.isPublic ? '$' + res.nextTotal.toLocaleString() : '不公開'}</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2 mt-1">
                        ${['fullDay', 'mgr', 'ga'].map(key => `
                            <button onclick="window.updateMemberField('${member.id}', '${key}', ${!member[key]})" class="flex-grow py-2 px-3 rounded-lg border ${member[key] ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-bold' : 'bg-white border-slate-200 text-slate-500'} text-xs text-center transition">
                                ${key === 'fullDay' ? '全日 +4k' : key === 'mgr' ? '區長 +500' : '工務 +1k'}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex items-center justify-between gap-3">
                         <div class="flex-grow">
                             <p class="text-[10px] text-slate-400 font-bold uppercase">加給彙整</p>
                             <p class="text-sm font-bold text-slate-700">+$${(res.totalSkillAccumulated + res.fixedBonus).toLocaleString()}</p>
                         </div>
                         <button onclick="window.openStationModal('${member.id}')" class="px-5 py-2.5 bg-slate-100 text-slate-700 text-sm font-bold rounded-xl flex items-center gap-2">
                             考核編輯 <span class="text-lg">›</span>
                         </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderCharts() {
            const ctx = document.getElementById('salaryChart').getContext('2d');
            const publicData = staffData.filter(s => !LEADERSHIP_ROLES.includes(s.pos)).sort((a,b) => calculateSalary(b).nextTotal - calculateSalary(a).nextTotal);
            if (publicData.length === 0) return;
            const labels = publicData.map(s => s.name);
            const data = publicData.map(s => calculateSalary(s).nextTotal);
            if (mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: '下月預計月薪', data, backgroundColor: '#10b981', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: false, min: 35000 } } }
            });
        }

        window.openStationModal = (id) => {
            const member = staffData.find(m => m.id === id);
            document.getElementById('modal-name').innerText = `${member.name} 的考核進度`;
            const content = document.getElementById('modal-content');
            content.innerHTML = STATIONS.map(s => {
                const rec = member.stations[s.id];
                return `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="font-bold text-slate-700 text-sm">${s.name} (+$${s.val})</span>
                        <div class="flex gap-2">
                            <select onchange="window.updateStationField('${id}', '${s.id}', 'y', this.value)" class="bg-white border border-slate-200 rounded-lg px-2 py-2 text-xs">
                                <option value="">年</option>${YEARS.map(y => `<option value="${y}" ${rec.y == y ? 'selected' : ''}>${y}</option>`).join('')}
                            </select>
                            <select onchange="window.updateStationField('${id}', '${s.id}', 'm', this.value)" class="bg-white border border-slate-200 rounded-lg px-2 py-2 text-xs">
                                <option value="">月</option>${MONTHS.map(m => `<option value="${m}" ${rec.m == m ? 'selected' : ''}>${m}</option>`).join('')}
                            </select>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('station-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('station-modal').classList.add('hidden');

        window.exportCSV = () => {
            let csv = "\uFEFF姓名,職位,加給總計,本月實領,下月預計\n";
            staffData.forEach(m => {
                const res = calculateSalary(m);
                csv += `${m.name},${m.pos},${res.totalSkillAccumulated + res.fixedBonus},${res.isPublic ? res.currentTotal : '不公開'},${res.isPublic ? res.nextTotal : '不公開'}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `廚房薪資表.csv`);
            link.click();
        };

        // 啟動 Firebase 連線
        initFirebase();
    </script>
</body>
</html>
